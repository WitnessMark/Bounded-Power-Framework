# Shared vocabulary for BPF forms, bundle, and validator.
# One list per field. Forms, bundle, and validator must all use these exact values.
vocab_version: v1
vocab_date: 2026-11-11

record_type: [observed, authorization, example]   # example = generic worked example; figures tagged [EX] are illustrative
prepared_by: [person, ai_assisted, authority]
institution_type: [government, tribal, private_company, nonprofit, international, other]
adoption_status: [adopted, not_adopted, UNKNOWN]

# How a power counts as authority (Core Requirements, Definitions: Authority)
authority_basis: [direct, indirect_a_operationalized, indirect_b_directive_control, influence_only, UNKNOWN]

# Plain-language power categories (institution in, powers out)
power_category:
  - fines_fees_or_charges
  - arrest_detention_or_confinement
  - use_of_force
  - inspection_search_or_surveillance
  - data_collection_or_records
  - scoring_ranking_or_classification
  - benefits_eligibility_or_allocation
  - licensing_permits_or_access
  - rules_standards_or_prices
  - property_land_or_seizure
  - removal_custody_or_placement
  - employment_or_discipline
  - information_control_or_visibility
  - other

# Three-answer rule for every factual field
answer_special: [UNKNOWN, NONE EXISTS]

# Finding labels (Core Requirements, Force and Status; SCBP-03 Step 0.3b)
finding: [conforming, not_conforming, not_demonstrated, not_applicable]

# Requirement rows in the observed-vs-required table (fixed order)
requirement_rows:
  - authorization        # 3.A.1, 3.A.2
  - maximum_term         # 3.E.1, 7.2
  - harm_thresholds      # 3.A.5
  - stop_paths           # 3.A.7, 3.C.1
  - ending_plan          # 3.A.9
  - remedy               # 3.A.10
  - data_limits          # 2.D.12-2.D.14
  - visibility           # 3.B.9
  - floors               # Part II
  - evasion              # Part IV

floors: [ecological, economic, agency, human_rights]

# Harm categories (Core Requirements 3.A.5)
harm_category: [bodily, psychological, economic, ecological, informational, communicative, agency, generational, non_participant]

# What a stop path can stop (SCBP-03 Step 0.4)
stop_reach: [whole_power, one_practice, one_case, UNKNOWN]
holder_independence: [independent, partly_independent, not_independent, UNKNOWN]

# Sources
source_kind: [quote, data_point, first_hand]
source_verified: [yes, tool_text, unverified]   # yes = a person read the original; tool_text = exact text returned by a fetch tool; unverified = summary or extract only

# Witness reports
report_type: [incident, stop_signal, challenge, change_request, review_petition]
stop_signal_basis: [defined_condition, credible_pathway, NONE]
identity_disclosure: [identified, pseudonymous, anonymous]
location_precision: [exact, approximate, locality, region, withheld]
# What kind of situation the report describes; a report can be more than one
# scene = something the witness saw happen; process = something done through decisions, letters or calls;
# condition = something ongoing the witness has noticed over time
situation_kind: [scene, process, condition]
# What the institution did (a report can list more than one)
action_category: [use_of_force, arrest_or_detention, stop_or_search, threat_or_intimidation,
  surveillance_or_data_collection, eviction_or_removal, utility_shutoff, fine_fee_or_seizure,
  benefit_or_service_denied, decision_without_explanation, retaliation, discrimination,
  failure_to_act, records_error, environmental_harm, other]
# What it did to people (a report can list more than one)
harm_type: [physical_injury, death, loss_of_liberty, financial, housing, health, employment,
  privacy, emotional_distress, property, environmental, none_known]
affected_count: [one, 2_10, 11_100, over_100, unknown]
# How the person reporting knows: it happened to them, they saw or heard it happen, they learned of it
# first-hand afterwards (documents, the aftermath), they were told by others, or they report for someone else
reporter_role: [affected_person, eyewitness, learned_after, told_by_others, on_behalf_of]
evidence_type: [video, photo, audio, document, message, medical_record, physical, none]
# Anything before the report was written that could have changed the memory
memory_influence: [none, talked_with_witnesses, saw_video, saw_news, unknown]
# The declaration above the signature. plain = "true to the best of my knowledge and belief"
truth_statement: [none, plain]
# Who wrote the statement from the witness's account
composed_by: [witness, ai_interview, web_form, helper]
# Authority responses
# adoption_notice = the institution formally declares it has adopted the Core Requirements
# change_notice = the institution reports a change to its powers, safeguards, procedures, or limits,
#                 without necessarily adopting the Core Requirements
response_type: [correction, added_information, disagreement, adoption_notice, change_notice]

# institution_statement = the institution's own published rule, policy, notice, or announcement: what it says it does, not proof it did it
claim_type: [adjudicated_or_admitted_fact, settled_without_admission, institution_statement, my_observation, allegation_or_estimate]
floor_answer: [yes, no, UNKNOWN, NONE EXISTS, not_applicable]
